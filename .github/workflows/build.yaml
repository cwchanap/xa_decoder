name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      # shortcut: warnings don't fail the build yet (existing code has ~16 clippy warnings, fmt diff too); add `-- -D warnings` and `cargo fmt --check` after a cleanup pass
      - run: cargo clippy --all-targets
      - name: Install wasm-pack
        run: curl --proto '=https' --tlsv1.2 -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build WASM package
        run: wasm-pack build --target web
